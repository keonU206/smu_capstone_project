# ----------------------------------------
# 1. MySQL 데이터베이스 연결 설정
# ----------------------------------------
# Docker 환경에서는 DB_URL 환경변수로 재정의 가능
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/naengjang_goat_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:43214321}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# 2. JPA & Hibernate
# ----------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
# ddl-auto: Entity 변경 사항을 DB 스키마에 자동 반영 (운영 환경에선 validate 권장)
spring.jpa.hibernate.ddl-auto=update

# ----------------------------------------
# 3. Flyway 비활성화
# ----------------------------------------
# V006 ALTER 대상 테이블이 JPA Entity로만 정의돼 있어 Flyway 단독 실행 시 실패.
# JPA ddl-auto=update 가 모든 테이블/컬럼을 자동 생성하므로 Flyway 비활성화.
spring.flyway.enabled=false

# ----------------------------------------
# 4. JWT (JSON Web Token)
# ----------------------------------------
# 운영 환경에서는 반드시 환경변수 또는 Secrets Manager 로 주입할 것
jwt.secret=${JWT_SECRET:NaengjangGoatSecretKeyNaengjangGoatSecretKey1234567890}
# Access Token 만료: 1시간 (ms)
jwt.access-token-expiration-ms=3600000
# Refresh Token 만료: 7일 (ms)
jwt.refresh-token-expiration-ms=604800000

# ----------------------------------------
# 5. Spring Batch
# ----------------------------------------
# MySQL 환경에서 BATCH_JOB_INSTANCE 등 메타 테이블 자동 생성 (default 'embedded' 는 H2 전용)
spring.batch.jdbc.initialize-schema=always

# ----------------------------------------
# 6. KAMIS API (농산물 유통정보)
# ----------------------------------------
kamis.api.base-url=https://www.kamis.or.kr/service/price/xml.do
kamis.api.key=${KAMIS_API_KEY:c7db4fde-1344-4f12-b708-e5f54a4c25f5}
kamis.api.id=6879
kamis.api.return-type=xml
kamis.api.action.daily=dailyPriceByCategoryList

# ----------------------------------------
# 7. Resilience4j Circuit Breaker
# ----------------------------------------
# redisLock 인스턴스 - RedissonLockStrategy 적용 대상
resilience4j.circuitbreaker.instances.redisLock.slidingWindowSize=10
resilience4j.circuitbreaker.instances.redisLock.failureRateThreshold=50
resilience4j.circuitbreaker.instances.redisLock.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.redisLock.permittedNumberOfCallsInHalfOpenState=3

# ----------------------------------------
# 8. Naver Shopping Search API
# ----------------------------------------
naver.shopping.client-id=${NAVER_CLIENT_ID:__qsCZWgRf3EP8iOLUHt}
naver.shopping.client-secret=${NAVER_CLIENT_SECRET:2qzrd2jYgM}
naver.shopping.base-url=https://openapi.naver.com/v1/search/shop.json

# ----------------------------------------
# 9. Redis
# ----------------------------------------
# Docker 환경에서는 REDIS_ADDRESS 환경변수로 재정의 (예: redis://redis:6379)
redis.address=redis://127.0.0.1:6379

# ----------------------------------------
# 10. Firebase (FCM 푸시)
# ----------------------------------------
# 서비스 계정 JSON 파일 경로. 파일 없으면 FCM 비활성화 (앱 정상 기동).
firebase.config.path=classpath:naengjanggoat-firebase-adminsdk-fbsvc-2eb865bacd.json
